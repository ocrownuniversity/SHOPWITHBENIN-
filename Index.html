<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BENIM Market</title>
    <style>
        /* ----- CSS Styling ----- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f2f2f2;
        }

        header {
            background: #28a745;
            color: #fff;
            padding: 15px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        section {
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            max-width: 900px;
        }

        h2 {
            margin-bottom: 15px;
            text-align: center;
        }

        input, select, button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #28a745;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        #dashboard #products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .product-card {
            background: #f9f9f9;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        #logoutBtn {
            margin-top: 20px;
            background: orange;
        }

        #logoutBtn:hover {
            background: darkorange;
        }

        #cartList li {
            margin-bottom: 6px;
        }

        #cartList button {
            margin-left: 10px;
            background: red;
            padding: 2px 6px;
            font-size: 12px;
        }

        #cartList button:hover {
            background: darkred;
        }
    </style>
</head>
<body>

    <header>
        BENIM Market
    </header>

    <!-- Sign Up Form -->
    <section id="signup">
        <h2>Sign Up</h2>
        <form>
            <input type="text" id="signupName" placeholder="Name" required>
            <input type="email" id="signupEmail" placeholder="Email" required>
            <input type="password" id="signupPassword" placeholder="Password" required>
            <select id="signupDepartment">
                <option value="clothes">Clothes</option>
                <option value="shoes">Shoes</option>
                <option value="accessories">Accessories</option>
            </select>
            <button type="button" id="signupBtn">Sign Up</button>
        </form>
    </section>

    <!-- Login Form -->
    <section id="login">
        <h2>Login</h2>
        <form>
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="button" id="loginBtn">Login</button>
        </form>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" style="display:none;">
        <h2>Dashboard</h2>
        <div id="products">
            <div class="product-card" data-department="clothes">
                <img src="https://via.placeholder.com/150?text=Clothes+1" alt="Clothes 1">
                <h4>Clothes 1</h4>
                <p>$25</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-department="clothes">
                <img src="https://via.placeholder.com/150?text=Clothes+2" alt="Clothes 2">
                <h4>Clothes 2</h4>
                <p>$30</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-department="shoes">
                <img src="https://via.placeholder.com/150?text=Shoes+1" alt="Shoes 1">
                <h4>Shoes 1</h4>
                <p>$50</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-department="accessories">
                <img src="https://via.placeholder.com/150?text=Accessories+1" alt="Accessories 1">
                <h4>Accessories 1</h4>
                <p>$15</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <button id="logoutBtn">Logout</button>
    </section>

    <!-- Cart Section -->
    <section id="cart">
        <h2>Your Cart</h2>
        <ul id="cartList">
            <li>No items in cart</li>
        </ul>
    </section>

    <script>
        /* ----- JavaScript ----- */
        let users = [];
        let currentUser = null;

        // Render Cart
        function renderCart() {
            const cartList = document.getElementById("cartList");
            cartList.innerHTML = "";
            if (!currentUser || currentUser.cart.length === 0) {
                cartList.innerHTML = "<li>No items in cart</li>";
                return;
            }
            currentUser.cart.forEach((item, index) => {
                const li = document.createElement("li");
                li.textContent = item + " ";
                const btn = document.createElement("button");
                btn.textContent = "Remove";
                btn.addEventListener("click", () => {
                    currentUser.cart.splice(index, 1);
                    renderCart();
                });
                li.appendChild(btn);
                cartList.appendChild(li);
            });
        }

        // Sign Up
        document.getElementById("signupBtn").addEventListener("click", () => {
            const name = document.getElementById("signupName").value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value.trim();
            const department = document.getElementById("signupDepartment").value;
            if (users.find(u => u.email === email)) {
                alert("This email has been used before!");
                return;
            }
            users.push({name, email, password, department, cart: []});
            alert("Sign Up Successful! Now log in.");
        });

        // Login
        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();
            const user = users.find(u => u.email === email && u.password === password);
            if (!user) {
                alert("Invalid email or password!");
                return;
            }
            currentUser = user;

            document.getElementById("login").style.display = "none";
            document.getElementById("signup").style.display = "none";
            document.getElementById("dashboard").style.display = "block";

            // Filter products by department
            document.querySelectorAll("#dashboard .product-card").forEach(card => {
                const dept = card.dataset.department;
                card.style.display = dept === currentUser.department ? "block" : "none";
            });

            renderCart();
        });

        // Add to Cart
        document.querySelectorAll("#dashboard .product-card button").forEach(btn => {
            btn.addEventListener("click", () => {
                if (!currentUser) { alert("Please log in first!"); return; }
                const pname = btn.parentElement.querySelector("h4").innerText;
                currentUser.cart.push(pname);
                renderCart();
                alert(pname + " added to your cart!\nTotal items: " + currentUser.cart.length);
            });
        });

        // Logout
        document.getElementById("logoutBtn").addEventListener("click", () => {
            currentUser = null;
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("login").style.display = "block";
            document.getElementById("signup").style.display = "block";
            renderCart();
        });
    </script>
</body>
</html>
